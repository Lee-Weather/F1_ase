# Velocity-conditioned ASE: fixed episode latent, task-dominant stand/walk/stop.
params:
  seed: -1
  algo:
    name: ase
  model:
    name: ase
  network:
    name: ase
    separate: true
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.9
        fixed_sigma: true
        learn_sigma: false
    mlp:
      units:
      - 1024
      - 1024
      - 512
      activation: relu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None
    disc:
      units:
      - 1024
      - 1024
      - 512
      activation: relu
      initializer:
        name: default
    enc:
      units:
      - 1024
      - 512
      activation: relu
      separate: false
      initializer:
        name: default
  load_checkpoint: false
  config:
    name: F1_ASE_Velocity
    env_name: rlgpu
    multi_gpu: false
    ppo: true
    mixed_precision: false
    normalize_input: true
    normalize_value: true
    reward_shaper:
      scale_value: 1
    normalize_advantage: true
    gamma: 0.99
    tau: 0.95
    learning_rate: 2e-5
    lr_schedule: constant
    score_to_win: 20000
    max_epochs: 1000
    save_best_after: 50
    save_frequency: 50
    print_stats: true
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: false
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 16384
    mini_epochs: 6
    critic_coef: 5
    clip_value: false
    seq_len: 4
    bounds_loss_coef: 10
    amp_obs_demo_buffer_size: 200000
    amp_replay_buffer_size: 200000
    amp_replay_keep_prob: 0.01
    amp_batch_size: 512
    amp_minibatch_size: 4096
    disc_coef: 5
    disc_logit_reg: 0.01
    disc_grad_penalty: 5
    disc_reward_scale: 2
    disc_weight_decay: 0.0001
    normalize_amp_input: true
    enable_eps_greedy: true
    latent_dim: 32
    latent_steps_min: 1
    latent_steps_max: 150
    amp_latent_grad_bonus: 0.0
    amp_latent_grad_bonus_max: 100.0
    amp_diversity_bonus: 0.0
    amp_diversity_tar: 1.0
    enc_coef: 5
    enc_weight_decay: 0.0
    enc_reward_scale: 1
    enc_grad_penalty: 0
    task_reward_w: 1.0
    disc_reward_w: 0.3
    enc_reward_w: 0.05
    privileged_critic: true
    latent_hold_episode: true
    enc_command_mask: true
